kr260_ground_station_sender:
  ros__parameters:
    # Safe loopback default; set to the PYNQ-Z2's actual WLAN address later.
    destination_ip: 127.0.0.1
    destination_port: 14600
    rate_hz: 5.0
    vehicle_id: uav1
    # Explicit PX4-local NED origin; match the PYNQ map calibration.
    # This is an example origin, not a measured takeoff reference.
    origin_ned_m: [0.0, 0.0, 0.0]
    key_file: ''
    position_topic: /fmu/out/vehicle_local_position_v1
    attitude_topic: /fmu/out/vehicle_attitude
    status_topic: /fmu/out/vehicle_status_v3
    battery_topic: /fmu/out/battery_status_v1
    flags_topic: /fmu/out/failsafe_flags
    land_topic: /fmu/out/vehicle_land_detected
    barometer_topic: /fmu/out/vehicle_air_data
    compass_topic: /fmu/out/vehicle_magnetometer
    gnss_topic: /fmu/out/sensor_gps
