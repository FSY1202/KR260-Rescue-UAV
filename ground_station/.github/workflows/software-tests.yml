name: Software checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/run_checks.py
      - run: python tools/render_previews.py
      - run: python tools/check_telemetry_loopback.py
      - name: Shell syntax
        run: find pynq_z2_desktop pynq_z2_gesture -name '*.sh' -print0 | xargs -0 -n1 bash -n
