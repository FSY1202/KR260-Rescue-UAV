Section "ServerFlags"
    Option "AutoAddGPU" "false"
EndSection
Section "Device"
    Identifier "PYNQ HDMI"
    Driver "modesetting"
    Option "kmsdev" "/dev/dri/card1"
    Option "AccelMethod" "none"
    Option "SWcursor" "true"
    Option "ShadowFB" "true"
EndSection
Section "Monitor"
    Identifier "HDMI Monitor"
EndSection
Section "Screen"
    Identifier "HDMI Screen"
    Device "PYNQ HDMI"
    Monitor "HDMI Monitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "800x600"
    EndSubSection
EndSection
Section "ServerLayout"
    Identifier "HDMI Layout"
    Screen 0 "HDMI Screen"
EndSection
